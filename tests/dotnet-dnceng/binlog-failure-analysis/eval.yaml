scenarios:
  - name: dotnet-msbuild-pr-build-failure
    prompt: >
      The Azure DevOps build for dotnet/msbuild PR #13835 just failed
      (check_run from app slug "azure-pipelines", conclusion: failure,
      AZDO_BUILD_ID=1435255 in dnceng-public/public). Use the
      binlog-failure-analysis skill to download the binlog from the
      failed build, identify the root causes, and post a single PR
      review comment summarising them.
    assertions:
      - type: output_contains
        value: binlog-failure-analysis
      - type: output_contains
        value: PostBuildLogs_
      - type: output_contains
        value: mcp-binlog-tool-aitools
      - type: output_not_contains
        value: ./build.sh -bl
      - type: output_not_contains
        value: ./build.sh --binaryLog
